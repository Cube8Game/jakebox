[package]
name = "jakebox"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
dashmap = "6.2.1"
mlua = { version = "0.12.2", features = ["luau", "async", "serde", "vendored", "macros"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
