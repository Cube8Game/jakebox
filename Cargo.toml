[package]
name = "jakebox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
dashmap = { version = "6.2.1", optional = true }
gloo-timers = { version = "0.4.0", features = ["futures"], optional = true }
leptos = { version = "0.8.22", features = ["csr"], optional = true }
mlua = { version = "0.12.2", features = ["luau", "async", "serde", "vendored", "macros"], optional = true }
rand = { version = "0.10.3", optional = true }
reqwest = { version = "0.13.5", features = ["json"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = { version = "2.0.21", optional = true }
tower-http = { version = "0.7.1", optional = true, features = ["cors", "fs"] }
wasm-bindgen-futures = { version = "0.4.79", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt"] }

[features]
server = ["dep:dashmap", "dep:rand", "dep:axum", "dep:tower-http"]
client = ["dep:reqwest", "dep:thiserror"]
host = ["client", "dep:mlua"]
cli = ["dep:clap"]
web = ["dep:leptos", "dep:wasm-bindgen-futures", "dep:gloo-timers"]
static-hosting = ["server"]
default = ["server", "client", "cli"]
